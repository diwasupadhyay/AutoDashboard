services:
  - type: web
    name: autodashboard-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://autodashboardcsv.app,https://www.autodashboardcsv.app,https://autodashboardcsv.netlify.app,https://www.autodashboardcsv.netlify.app
